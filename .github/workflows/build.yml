name: Build Aura Island

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Windows x64 (MSVC 2022 + Qt 6.8+)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Version
        id: get_version
        shell: powershell
        run: |
          $version = "1.0.0"
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $version = $env:GITHUB_REF.Substring(11)
          } elseif (Test-Path "VERSION") {
            $version = (Get-Content "VERSION").Trim()
          }
          Write-Host "App Version: $version"
          echo "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Disable WindowsApps Python redirector
        shell: powershell
        run: |
          Remove-Item "$env:LOCALAPPDATA\Microsoft\WindowsApps\python*.exe" -Force -ErrorAction SilentlyContinue

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja & Inno Setup
        run: |
          choco install ninja -y
          choco install innosetup -y

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtnetworkauth'
          cache: true

      - name: Configure CMake
        run: |
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Build App Release
        run: |
          cmake --build build --config Release --verbose 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content build.log | Where-Object { $_ -match "error C" -or $_ -match "FAILED:" -or $_ -match "fatal error" } | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Deploy Qt Runtime & Dependencies (windeployqt)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist\AuraIsland
          Copy-Item build\AuraIsland.exe dist\AuraIsland\

          # Run windeployqt with QML scan and compiler runtime
          windeployqt.exe --qmldir qml dist\AuraIsland\AuraIsland.exe --compiler-runtime --no-translations --verbose 1

          Write-Host "Contents of dist\AuraIsland:"
          Get-ChildItem -Path dist\AuraIsland | Select-Object Name, Length

      - name: Verify Dependencies
        shell: powershell
        run: |
          .\verify_dependencies.ps1 -AppDir dist\AuraIsland

      - name: Run Offscreen Selftest
        shell: powershell
        run: |
          Write-Host "Running AuraIsland.exe --selftest..."
          & "dist\AuraIsland\AuraIsland.exe" --selftest
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Selftest returned non-zero exit code: $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          Write-Host "Selftest passed successfully."

      - name: Build AuraEngine with Inno Setup 6
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist-engine
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" /DAppVersion="$env:APP_VERSION" installer\AuraEngine.iss
          Write-Host "Contents of dist-engine:"
          Get-ChildItem -Path dist-engine | Select-Object Name, Length

      - name: Build AuraSetupStub with Embedded AuraEngine
        shell: powershell
        run: |
          $enginePath = (Resolve-Path "dist-engine\AuraEngine.exe").Path
          Write-Host "Embedding engine from: $enginePath"
          cmake -B build-stub -S installer/stub -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DAPP_VERSION="$env:APP_VERSION" -DAURA_ENGINE_PATH="$enginePath"
          cmake --build build-stub --config Release
          New-Item -ItemType Directory -Force -Path dist-installer
          Copy-Item "build-stub\AuraIsland-Setup-$env:APP_VERSION.exe" dist-installer\
          Write-Host "Setup executable created:"
          Get-ChildItem -Path dist-installer | Select-Object Name, Length

      - name: Smoke Test on Runner
        shell: powershell
        run: |
          Write-Host "Executing smoke test: Silent install to C:\AuraTest..."
          Start-Process -FilePath "dist-engine\AuraEngine.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=""C:\AuraTest""" -Wait

          if (-not (Test-Path "C:\AuraTest\AuraIsland.exe")) {
            Write-Host "::error::Installed executable C:\AuraTest\AuraIsland.exe does not exist!"
            exit 1
          }
          Write-Host "Installed AuraIsland.exe exists. Running selftest in installed directory..."
          & "C:\AuraTest\AuraIsland.exe" --selftest
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Installed selftest failed with code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

          Write-Host "Testing silent uninstaller..."
          $uninstaller = Get-ChildItem -Path "C:\AuraTest" -Filter "unins*.exe" | Select-Object -First 1
          if (-not $uninstaller) {
            Write-Host "::error::Uninstaller not found in C:\AuraTest!"
            exit 1
          }
          Start-Process -FilePath $uninstaller.FullName -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait
          Start-Sleep -Seconds 2

          if (Test-Path "C:\AuraTest\AuraIsland.exe") {
            Write-Host "::error::Installed folder C:\AuraTest\AuraIsland.exe was not cleanly removed by uninstaller!"
            exit 1
          }
          Write-Host "Smoke test completed successfully!"

      - name: Create Portable Zip Package
        shell: powershell
        run: |
          Compress-Archive -Path dist\AuraIsland\* -DestinationPath AuraIsland-win64.zip -Force
          Write-Host "Package created: AuraIsland-win64.zip"

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraIsland-Setup-${{ env.APP_VERSION }}
          path: dist-installer/AuraIsland-Setup-*.exe
          retention-days: 14

      - name: Upload Portable Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraIsland-win64-portable
          path: AuraIsland-win64.zip
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-installer/AuraIsland-Setup-*.exe
            AuraIsland-win64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build Aura Island

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Windows x64 (MSVC 2022 + Qt 6.8+)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Version
        id: get_version
        shell: powershell
        run: |
          $version = "1.0.0"
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $version = $env:GITHUB_REF.Substring(11)
          } elseif (Test-Path "VERSION") {
            $version = (Get-Content "VERSION").Trim()
          }
          Write-Host "App Version: $version"
          echo "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Disable WindowsApps Python redirector
        shell: powershell
        run: |
          Remove-Item "$env:LOCALAPPDATA\Microsoft\WindowsApps\python*.exe" -Force -ErrorAction SilentlyContinue

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja & Inno Setup
        run: |
          choco install ninja -y
          choco install innosetup -y

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtnetworkauth'
          cache: true

      - name: Configure CMake
        run: |
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --config Release --verbose 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content build.log | Where-Object { $_ -match "error C" -or $_ -match "FAILED:" -or $_ -match "fatal error" } | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Deploy Qt Runtime & Dependencies (windeployqt)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist\AuraIsland
          Copy-Item build\AuraIsland.exe dist\AuraIsland\

          # Run windeployqt with QML scan
          windeployqt.exe --qmldir qml dist\AuraIsland\AuraIsland.exe --compiler-runtime --no-translations --verbose 1

          Write-Host "Contents of dist\AuraIsland:"
          Get-ChildItem -Path dist\AuraIsland | Select-Object Name, Length

      - name: Build Setup.exe with Inno Setup
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" /DMyAppVersion="$env:APP_VERSION" installer\AuraIsland.iss
          Write-Host "Contents of dist-installer:"
          Get-ChildItem -Path dist-installer | Select-Object Name, Length

      - name: Create Portable Zip Package
        shell: powershell
        run: |
          Compress-Archive -Path dist\AuraIsland\* -DestinationPath AuraIsland-win64.zip -Force
          Write-Host "Package created: AuraIsland-win64.zip"

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraIsland-Setup-${{ env.APP_VERSION }}
          path: dist-installer/AuraIsland-Setup-*.exe
          retention-days: 14

      - name: Upload Portable Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraIsland-win64-portable
          path: AuraIsland-win64.zip
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-installer/AuraIsland-Setup-*.exe
            AuraIsland-win64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

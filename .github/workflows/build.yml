name: Build Aura Island

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Windows x64 (MSVC 2022 + Qt 6.8+)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Disable WindowsApps Python redirector
        shell: powershell
        run: |
          Remove-Item "$env:LOCALAPPDATA\Microsoft\WindowsApps\python*.exe" -Force -ErrorAction SilentlyContinue

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtnetworkauth'
          cache: true

      - name: Configure CMake
        run: |
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --config Release --verbose 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Build failed! Showing error log tail:"
            Get-Content build.log -Tail 100
            exit 1
          }

      - name: Deploy Qt Runtime & Dependencies (windeployqt)
        run: |
          New-Item -ItemType Directory -Force -Path dist\AuraIsland
          Copy-Item build\AuraIsland.exe dist\AuraIsland\

          # Run windeployqt with QML scan
          windeployqt.exe --qmldir qml dist\AuraIsland\AuraIsland.exe --compiler-runtime --no-translations --verbose 1

          # List contents to verify executable is present
          Write-Host "Contents of dist\AuraIsland:"
          Get-ChildItem -Path dist\AuraIsland | Select-Object Name, Length

      - name: Create Zip Package
        run: |
          Compress-Archive -Path dist\AuraIsland\* -DestinationPath AuraIsland-win64.zip -Force
          Write-Host "Package created: AuraIsland-win64.zip"

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraIsland-win64
          path: dist/AuraIsland/
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AuraIsland-win64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="islandGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#92FE9D" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF512F" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="pillGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c2d35" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#121318" stop-opacity="0.98"/>
    </linearGradient>
    <filter id="glassBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
    </filter>
  </defs>
  <!-- Ambient glow backdrop -->
  <rect x="16" y="36" width="96" height="40" rx="20" fill="url(#islandGlow)" filter="url(#glassBlur)"/>
  <!-- Dark Liquid Glass Pill -->
  <rect x="20" y="40" width="88" height="32" rx="16" fill="url(#pillGlass)" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
  <!-- Specular sheen -->
  <path d="M 28 42 Q 64 47 100 42" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1" fill="none" stroke-linecap="round"/>
  <!-- Dynamic Island dot and sensor cutouts -->
  <circle cx="42" cy="56" r="3.5" fill="#000000" stroke="#ffffff" stroke-opacity="0.2" stroke-width="0.8"/>
  <rect x="52" y="53" width="36" height="6" rx="3" fill="#000000" stroke="#ffffff" stroke-opacity="0.15" stroke-width="0.8"/>
</svg>